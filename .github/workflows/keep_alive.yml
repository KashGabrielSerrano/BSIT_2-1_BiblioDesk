name: Keep Supabase Active

on:
  schedule:
    # Runs twice daily at 00:00 and 12:00 UTC (8:00 AM and 8:00 PM GMT+8)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Database Query Request to Supabase REST API
        run: |
          curl -i -X GET "https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/rest/v1/keep_alive?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
